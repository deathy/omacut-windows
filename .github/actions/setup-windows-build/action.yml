name: Set up Windows build
description: Installs the Qt version omacut builds against, and locates the MSVC toolchain.

inputs:
  qt-version:
    description: Qt version to install
    required: false
    default: '6.8.1'

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        # qtmultimedia is an add-on. qtbase and qtdeclarative come with the
        # base install, and Qt Quick Controls rides along with qtdeclarative.
        modules: qtmultimedia
        cache: true

    # Rather than a third-party action -- the usual one is still on Node 20,
    # with no Node 24 release to move to -- find vcvars64.bat and let each
    # build step call it. Environment set by a `call` does not survive the
    # step, so the path is exported and the callers do the rest.
    - name: Locate MSVC
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" ( echo vswhere.exe not found & exit /b 1 )
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        if not defined VSPATH ( echo No MSVC toolchain found & exit /b 1 )
        if not exist "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" ( echo vcvars64.bat not found under "%VSPATH%" & exit /b 1 )
        echo Found MSVC at %VSPATH%
        echo VCVARS=%VSPATH%\VC\Auxiliary\Build\vcvars64.bat>>"%GITHUB_ENV%"
