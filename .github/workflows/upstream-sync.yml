name: Upstream sync

on:
  schedule:
    # Daily. Upstream releases every few weeks, so this is mostly a no-op.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: omacom/omacut

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare our base against the newest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          current=$(tr -d '[:space:]' < UPSTREAM_VERSION)
          echo "upstream latest: $latest"
          echo "we are on:       $current"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when a sync for this tag is already open
        id: existing
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="sync/${{ steps.check.outputs.latest }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The port is upstream + overlay/ + patches/ (see PORT.md), so moving to
      # a new upstream release means applying the patches to it. Patches that
      # apply are re-exported against the new tag, so that patches/ always
      # applies exactly to UPSTREAM_VERSION.
      - name: Apply the patches to the new upstream tag
        id: apply
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          set -uo pipefail
          latest="${{ steps.check.outputs.latest }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A patch that does not apply means the port touches something
          # upstream just changed. That needs resolving with the intent in
          # PORT.md to hand -- resolving it unattended and shipping the result
          # is exactly how a port silently breaks.
          if pwsh -File bin/prepare-source.ps1 -Ref "$latest" 2>&1 | tee /tmp/prepare.log; then
            set -e
            pwsh -File bin/export-patches.ps1
            echo "$latest" > UPSTREAM_VERSION
            git checkout -b "sync/$latest"
            git add -A patches overlay UPSTREAM_VERSION
            git commit -m "Track upstream $latest"
            git push origin "sync/$latest"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce the sync
        if: steps.apply.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          latest="${{ steps.check.outputs.latest }}"
          branch="sync/$latest"
          compare="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"

          cat > /tmp/body.md <<BODY
          Upstream released [\`$latest\`](https://github.com/$UPSTREAM/releases/tag/$latest)
          and every patch applied to it. \`patches/\` is re-exported against
          the new tag, so most of the diff here is line numbers and blob ids.

          A clean apply proves nothing about behaviour: upstream may have added
          code or tests the port has to adapt even though no patch conflicted.
          Go through the checklist in PORT.md ("Moving to a new upstream
          release") before merging.

          Opening this runs the Build workflow, which runs the tests on Windows
          and leaves an \`omacut-win64\` artifact. Try it on Windows before
          merging -- a green build only proves that it compiles.

          Merging this and tagging \`win-$latest\` publishes a Windows release
          (release tags are namespaced to stay clear of upstream's own).
          BODY

          # Both of these need permissions the default GITHUB_TOKEN does not
          # always have on a personal account, and neither is settable from the
          # repository API. The branch is pushed regardless, so degrade in
          # steps rather than lose the sync.
          if gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
               --title "Sync with upstream $latest" --body-file /tmp/body.md; then
            echo "Opened a pull request for $branch"
            exit 0
          fi

          echo "Could not open a pull request; trying an issue"
          if gh issue create --repo "$GITHUB_REPOSITORY" \
               --title "Sync with upstream $latest is ready" \
               --body-file /tmp/body.md; then
            echo "Filed an issue for $branch"
            exit 0
          fi

          # Nothing could be created, so make the run itself the notification:
          # a failed run is emailed, and the summary says what to do about it.
          {
            echo "## Upstream $latest is applied and waiting"
            echo
            echo "The branch \`$branch\` is pushed. Opening the pull request"
            echo "is what builds it -- GitHub raises no events for a push made"
            echo "with GITHUB_TOKEN."
            echo
            echo "**[Open the pull request]($compare)**"
            echo
            echo "This run is marked failed only because it could not open the"
            echo "pull request or issue itself -- the sync worked. To let it,"
            echo "turn on *Allow GitHub Actions to create and approve pull"
            echo "requests* under Settings -> Actions -> General."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Upstream $latest applied onto $branch, but no PR or issue could be created."
          echo "Open it here: $compare"
          exit 1

      - name: File an issue when a patch does not apply
        if: steps.apply.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="${{ steps.check.outputs.latest }}"
          title="Upstream $latest conflicts with the Windows port"

          # A conflict pushes no branch, so the branch check above never trips
          # and this step is reached every day until someone resolves it. One
          # issue per upstream tag is enough.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already tracks this conflict"
            exit 0
          fi

          log=$(tail -n 25 /tmp/prepare.log)
          cat > /tmp/issue-body.md <<BODY
          Upstream released [\`$latest\`](https://github.com/$UPSTREAM/releases/tag/$latest),
          but the port's patches do not all apply to it:

          \`\`\`
          $log
          \`\`\`

          To resolve it -- PORT.md, "Moving to a new upstream release", has the
          details and a checklist to go through afterwards:

          \`\`\`
          git checkout -b sync/$latest main
          pwsh -File bin/prepare-source.ps1 -Ref $latest   # stops on the patch that conflicts
          # resolve in work/, keeping the intent PORT.md gives for that patch
          git -C work add <files>
          git -C work am --continue                        # repeat per patch
          pwsh -File bin/export-patches.ps1
          echo $latest > UPSTREAM_VERSION
          \`\`\`

          If a patch is easier to redo than to rescue, PORT.md describes each
          one well enough to rewrite it against the new code.
          BODY
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file /tmp/issue-body.md
