name: Build

on:
  push:
    # sync/** covers a sync branch pushed by hand. A branch pushed by the
    # sync workflow does not land here: GitHub does not raise events for
    # pushes made with GITHUB_TOKEN. Opening the pull request is what builds
    # those, via pull_request below.
    branches: [main, 'sync/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # There is no omacut source in this repository: the tree to build is
      # upstream at UPSTREAM_VERSION with overlay/ and patches/ on top, put
      # together in work/. See PORT.md.
      - name: Prepare source
        shell: pwsh
        run: ./bin/prepare-source.ps1

      - uses: ./.github/actions/setup-windows-build

      # omacut and both test suites, with upstream's CMakeLists.txt adjusted
      # from outside by overlay/port/omacut-port.cmake (see PORT.md). vcvars
      # also puts the CMake and Ninja that come with MSVC on the PATH.
      - name: Build omacut and the tests
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          pwsh -File bin/build-cmake.ps1 || exit /b 1

      - name: Install ffmpeg for the test run
        shell: pwsh
        run: |
          # The backend tests shell out to a real ffmpeg to cut real files.
          choco install ffmpeg --no-progress -y
          ffmpeg -version

      - name: Run tests
        shell: pwsh
        env:
          # The runner has no interactive desktop, so Qt Quick cannot make a
          # real window; offscreen is the standard platform plugin for CI.
          QT_QPA_PLATFORM: offscreen
        run: |
          $failed = @()
          foreach ($suite in 'omacut_tests', 'dialogfilepicker_tests') {
            $exe = Join-Path build "$suite.exe"
            if (-not (Test-Path $exe)) { throw "No $suite.exe was built" }
            Write-Host "== $suite =="

            # QtTest's stdout arrives empty on this runner however it is
            # captured; its own file logger is a different path out.
            $log = Join-Path $PWD "$suite.txt"
            & $exe -o "$log,txt"
            $code = $LASTEXITCODE

            if (Test-Path $log) {
              Get-Content $log | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "QtTest wrote no log file either"
            }
            Write-Host "$suite exited with $code"
            if ($code -ne 0) { $failed += "$suite ($code)" }
          }
          if ($failed.Count) { throw "Failing suites: $($failed -join ', ')" }

      # Through cmd so vcvars is in scope: packaging copies the Visual C++
      # runtime, and only the MSVC environment says where it lives.
      - name: Package
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          set SHA=%GITHUB_SHA%
          pwsh -File bin/package-windows.ps1 -Version "ci-%SHA:~0,7%" || exit /b 1

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: omacut-win64
          path: dist/*.zip
          if-no-files-found: error

  # Experimental: the same port, built as an Apple silicon .app. Nothing in
  # the source is macOS-specific; this is packaging and CI only. See PORT.md,
  # "macOS".
  macos:
    # Not macos-latest: Qt 6.8.1 supports the macOS 15 SDK, and its headers
    # stop compiling under Xcode 26 (qyieldcpu.h calls an undeclared
    # __yield). Moving off 6.8.1 would mean leaving the Qt the Windows build
    # and patches 6 and 7 are written against.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Use the Xcode Qt 6.8.1 supports
        run: |
          xcode="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "No Xcode 16 on this runner"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Prepare source
        shell: pwsh
        run: ./bin/prepare-source.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      # Through bin/build-cmake.ps1, like Windows; the port hook makes it an
      # omacut.app here. The app alone first, so that it is packaged and
      # uploaded even if a test suite fails to compile.
      - name: Build omacut
        run: |
          command -v ninja >/dev/null || brew install ninja
          pwsh -File bin/build-cmake.ps1 -Target omacut

      - name: Package
        run: pwsh -File bin/package-macos.ps1 -Version "ci-${GITHUB_SHA::7}"

      # Uploaded before the tests run, unlike on Windows: while this build is
      # an experiment, a test that fails on macOS for reasons of its own
      # should not cost the app to try by hand. The job still goes red.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: omacut-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

      - name: Build tests
        run: pwsh -File bin/build-cmake.ps1

      # The backend tests shell out to a real ffmpeg. Use the one just
      # bundled into the app, so the tests run against what ships.
      - name: Put the bundled ffmpeg on the PATH
        run: |
          dir="$(echo "$GITHUB_WORKSPACE"/dist/omacut-*-macos-arm64/omacut.app/Contents/MacOS)"
          "$dir/ffmpeg" -hide_banner -version | head -1
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          failed=""
          for suite in omacut_tests dialogfilepicker_tests; do
            echo "== $suite =="
            "build/$suite" || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then echo "Failing suites:$failed"; exit 1; fi
