name: Build

on:
  push:
    # sync/** covers a sync branch pushed by hand. A branch pushed by the
    # sync workflow does not land here: GitHub does not raise events for
    # pushes made with GITHUB_TOKEN. Opening the pull request is what builds
    # those, via pull_request below.
    branches: [main, 'sync/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # There is no omacut source in this repository: the tree to build is
      # upstream at UPSTREAM_VERSION with overlay/ and patches/ on top, put
      # together in work/. See PORT.md.
      - name: Prepare source
        shell: pwsh
        run: ./bin/prepare-source.ps1

      - uses: ./.github/actions/setup-windows-build

      - name: Build omacut
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          mkdir build && cd build
          qmake "%GITHUB_WORKSPACE%\work\omacut-windows.pro" || exit /b 1
          nmake || exit /b 1

      # Absolute .pro paths, so __FILE__ comes out absolute in the binary --
      # the QML tests locate Main.qml relative to it, and a relative path there
      # resolves against the working directory instead. This is what upstream's
      # own bin/test does.
      - name: Build tests
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          mkdir build-tests && cd build-tests
          qmake "%GITHUB_WORKSPACE%\work\tests\backend_tests-windows.pro" || exit /b 1
          nmake || exit /b 1
          cd ..
          mkdir build-tests-picker && cd build-tests-picker
          qmake "%GITHUB_WORKSPACE%\work\tests\dialogfilepicker_tests.pro" || exit /b 1
          nmake || exit /b 1

      - name: Install ffmpeg for the test run
        shell: pwsh
        run: |
          # The backend tests shell out to a real ffmpeg to cut real files.
          choco install ffmpeg --no-progress -y
          ffmpeg -version

      - name: Run tests
        shell: pwsh
        env:
          # The runner has no interactive desktop, so Qt Quick cannot make a
          # real window; offscreen is the standard platform plugin for CI.
          QT_QPA_PLATFORM: offscreen
        run: |
          $failed = @()
          foreach ($dir in 'build-tests', 'build-tests-picker') {
            $exe = Get-ChildItem -Path $dir -Recurse -File -Filter '*_tests.exe' |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $exe) { throw "No test binary was built in $dir" }
            Write-Host "== $($exe.Name) =="

            # Run from the directory qmake ran in, the way upstream's bin/test
            # does: qmake leaves __FILE__ relative in a shadow build, and the
            # QML tests locate Main.qml relative to it.
            $log = Join-Path $PWD "$($exe.BaseName).txt"
            Push-Location $dir
            try {
              # QtTest's stdout arrives empty on this runner however it is
              # captured; its own file logger is a different path out.
              & $exe.FullName -o "$log,txt"
              $code = $LASTEXITCODE
            } finally { Pop-Location }

            if (Test-Path $log) {
              Get-Content $log | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "QtTest wrote no log file either"
            }
            Write-Host "$($exe.Name) exited with $code"
            if ($code -ne 0) { $failed += "$($exe.Name) ($code)" }
          }
          if ($failed.Count) { throw "Failing suites: $($failed -join ', ')" }

      # Through cmd so vcvars is in scope: packaging copies the Visual C++
      # runtime, and only the MSVC environment says where it lives.
      - name: Package
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          set SHA=%GITHUB_SHA%
          pwsh -File bin/package-windows.ps1 -Version "ci-%SHA:~0,7%" || exit /b 1

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: omacut-win64
          path: dist/*.zip
          if-no-files-found: error

  # Experimental: the same port, built as an Apple silicon .app. Nothing in
  # the source is macOS-specific; this is packaging and CI only. See PORT.md,
  # "macOS".
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare source
        shell: pwsh
        run: ./bin/prepare-source.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Build omacut
        run: |
          mkdir build && cd build
          qmake "$GITHUB_WORKSPACE/work/omacut-windows.pro"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: pwsh -File bin/package-macos.ps1 -Version "ci-${GITHUB_SHA::7}"

      # Uploaded before the tests run, unlike on Windows: while this build is
      # an experiment, a test that fails on macOS for reasons of its own
      # should not cost the app to try by hand. The job still goes red.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: omacut-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

      # Absolute .pro paths, for the same reason as on Windows.
      - name: Build tests
        run: |
          mkdir build-tests && cd build-tests
          qmake "$GITHUB_WORKSPACE/work/tests/backend_tests-windows.pro"
          make -j"$(sysctl -n hw.ncpu)"
          cd ..
          mkdir build-tests-picker && cd build-tests-picker
          qmake "$GITHUB_WORKSPACE/work/tests/dialogfilepicker_tests.pro"
          make -j"$(sysctl -n hw.ncpu)"

      # The backend tests shell out to a real ffmpeg. Use the one just
      # bundled into the app, so the tests run against what ships.
      - name: Put the bundled ffmpeg on the PATH
        run: |
          dir="$(echo "$GITHUB_WORKSPACE"/dist/omacut-*-macos-arm64/omacut.app/Contents/MacOS)"
          "$dir/ffmpeg" -hide_banner -version | head -1
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          failed=""
          for t in build-tests/backend_tests build-tests-picker/dialogfilepicker_tests; do
            echo "== $t =="
            # From the directory qmake ran in, as on Windows.
            (cd "$(dirname "$t")" && "./$(basename "$t")") || failed="$failed $t"
          done
          if [ -n "$failed" ]; then echo "Failing suites:$failed"; exit 1; fi
