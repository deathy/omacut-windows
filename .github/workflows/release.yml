name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-build

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          if (-not $v) { throw 'No version to build' }

          # A semver pre-release tag (v0.4.0-alpha.1) publishes as a
          # pre-release; a plain one (v0.4.0) publishes as a full release.
          $pre = $v -match '-'

          # The upstream version this is a port of, without our own suffix.
          $upstream = ($v -split '-')[0]

          "version=$v"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($pre.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "upstream=$upstream" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building $v (prerelease: $pre, upstream: $upstream)"

      - name: Build omacut
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          mkdir build && cd build
          qmake "%GITHUB_WORKSPACE%\omacut.pro" || exit /b 1
          nmake || exit /b 1

      - name: Build and run tests
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          mkdir build-tests && cd build-tests
          qmake "%GITHUB_WORKSPACE%\tests\backend_tests.pro" || exit /b 1
          nmake || exit /b 1

      - name: Install ffmpeg for the test run
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Never publish a release whose own test suite does not pass.
          $exe = Get-ChildItem -Path build-tests -Recurse -File -Filter 'backend_tests.exe' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No test binary was built' }
          # QtTest's stdout arrives empty on the Windows runner; its own file
          # logger is the way to see results.
          $log = Join-Path $PWD 'backend_tests.txt'
          Push-Location build-tests
          try {
            & $exe.FullName -o "$log,txt"
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($code -ne 0) { throw 'Tests failed -- not releasing' }

      # Through cmd so vcvars is in scope: packaging copies the Visual C++
      # runtime, and only the MSVC environment says where it lives.
      - name: Package
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          pwsh -File bin/package-windows.ps1 -Version "${{ steps.version.outputs.version }}" || exit /b 1

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: omacut ${{ steps.version.outputs.version }} for Windows
          files: dist/*.zip
          prerelease: ${{ steps.version.outputs.prerelease }}
          # The handwritten body says what matters. Auto-notes on a first
          # release would replay the whole of upstream's history.
          generate_release_notes: false
          body: |
            Unofficial Windows build of
            [omacut ${{ steps.version.outputs.upstream }}](https://github.com/omacom/omacut/releases/tag/${{ steps.version.outputs.upstream }}),
            David Heinemeier Hansson's dead-simple video length trimmer.

            **Install:** download the zip below, unpack it anywhere, and run
            `omacut.exe`. ffmpeg is bundled -- there is nothing else to install.

            Windows SmartScreen will warn the first time, because these builds
            are not code-signed: *More info* then *Run anyway*.

            ### What to expect

            The Windows port is exercised on every build -- the full upstream
            test suite plus the port's own -- but a green build is not the same
            as a working app. Please report anything that misbehaves.

            Two deliberate differences from upstream: export quality is chosen
            in the **Save as type** dropdown of the save dialog rather than a
            separate combo, and the accent colour is upstream's default amber
            rather than an Omarchy theme colour.

            ### Licence

            omacut is MIT, Copyright (c) 2026 David Heinemeier Hansson. The
            bundled ffmpeg is a GPL build, pinned by hash -- see
            `THIRD-PARTY.md`, `FFMPEG-LICENSE.txt` and `FFMPEG-BUILD.txt`
            inside the zip.
